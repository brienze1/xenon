name: CI

on:
  push:
    branches: [init, main, 'xen-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Ensure make is available
        if: runner.os == 'Windows'
        run: command -v make || choco install make -y

      - name: Setup tools and frontend dependencies
        run: make setup

      - name: Generate bindings
        run: make bindings

      - name: Validate
        run: make validate

      - name: Fail on files changed by validate
        run: git diff --exit-code

      - name: Build
        run: make build
