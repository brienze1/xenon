edits: |
  openapi: 3.1.0
  info:
    title: Products
    description: Everything we sell.
    version: 1.0.0
  servers:
    - url: '{{baseUrl}}'
  tags:
    - name: Admin
      description: Back-office calls.
  x-tagGroups:
    - name: Back office
      tags:
        - Admin
        - Admin / Reports
  paths:
    /products:
      get:
        summary: List products
        description: Lists every product.
        x-xenon-id: 01JKF000000000000000000010
        security:
          - bearerAuth: []
      post:
        tags:
          - Admin
        summary: Create product
        x-xenon-id: 01JKF000000000000000000011
        security:
          - bearerAuth: []
    /reports/sales:
      get:
        tags:
          - Admin / Reports
        summary: Sales report
    /products/search:
      get:
        summary: Search products
  components:
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
